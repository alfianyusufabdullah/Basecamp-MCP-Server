services:
  redis:
    image: redis:7-alpine
    container_name: basecamp-redis
    volumes:
      - redis-data:/data
    restart: always

  oauth-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: basecamp-oauth-app
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --access-logfile - oauth_app:app
    ports:
      - "11876:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./oauth_tokens.json:/app/oauth_tokens.json
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: basecamp-mcp-server
    command: python basecamp_fastmcp.py
    ports:
      - "11877:8001"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8001
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./oauth_tokens.json:/app/oauth_tokens.json
    depends_on:
      - redis
    stdin_open: true
    tty: true
    restart: always

volumes:
  redis-data:
